name: Deploy to insolvent.trade

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DEPLOY_HOST: 159.69.193.250
  DEPLOY_USER: root
  DEPLOY_PATH: /root/hliq-v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -avz --delete src/     "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/src/"
          rsync -avz --delete public/  "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/public/"
          rsync -avz index.html        "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/index.html"
          rsync -avz vite.config.js    "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/vite.config.js"
          rsync -avz serve-prod.js     "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/serve-prod.js"

      # server.js is a DIFFERENT pm2 process (hliq-strat — bots and strategies), not the
      # frontend. Ship it every deploy, but bounce that process only when the file really
      # changed: a UI-only deploy must never interrupt a running strategy.
      #
      # -c (checksum) is load-bearing, not a nicety. rsync's default quick-check compares
      # size + mtime, and actions/checkout rewrites every file with a fresh mtime on each
      # run — so an untouched server.js looked modified and restarted the bots on EVERY
      # deploy. Comparing content instead makes "unchanged" actually mean unchanged.
      #
      # rsync -i prints one itemized line per file it acted on. The first character is the
      # direction ('<' pushing to a remote, '>' on a local copy) and it only appears when
      # data is really transferred; an attributes-only touch is reported as '.f..t…', which
      # must NOT count as a change.
      - name: Sync strategy server
        id: syncstrat
        run: |
          out=$(rsync -azc -i server.js "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/server.js")
          echo "${out:-(unchanged)}"
          if echo "$out" | grep -qE '^[<>]f'; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no"  >> "$GITHUB_OUTPUT"
          fi

      # pm2 runs serve-prod.js, which serves dist/ — source changes have no
      # effect until the bundle is rebuilt on the server.
      - name: Build and restart app
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && npm run build && pm2 restart hliq-v2"

      - name: Restart strategy server
        if: steps.syncstrat.outputs.changed == 'yes'
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "pm2 restart hliq-strat"
